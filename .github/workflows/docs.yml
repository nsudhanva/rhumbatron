# Publishes the docs site to https://rhumbatron.com after a push to main that changes it.
# The site is the Cloudflare Worker `rhumbatron-docs`, with static assets only
# (apps/docs/wrangler.json). The job runs only when the repository variable CLOUDFLARE_ACCOUNT_ID
# exists. `bun scripts/setup-docs-publishing.ts` sets it and the secret CLOUDFLARE_API_TOKEN.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  LEFTHOOK: "0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: publish rhumbatron.com
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/docs
        env:
          DOCS_SITE: https://rhumbatron.com
        run: bun run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.149.0 deploy -c apps/docs/wrangler.json

      - name: The site answers
        run: |
          curl -fsS -o /dev/null https://rhumbatron.com/
          curl -fsS -o /dev/null -w "%{http_code} %{redirect_url}\n" https://www.rhumbatron.com/
