# Checks for every pull request and every push to main. It uses no secrets and deploys nothing:
# Rhumbatron runs as a local Docker Compose stack (docs/operations/local-stack.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Git hooks are a local gate. CI runs the same checks as explicit steps.
  LEFTHOOK: "0"

jobs:
  checks:
    name: lint, types, tests, guards, build, compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The migration guard and the secret scan compare against earlier commits.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd services/sandboxd

      - name: Lint
        run: bun run lint

      - name: Guardrails (no tracked secrets, Docker socket only in the socket proxy)
        run: bun run check:guardrails

      - name: Dependency hygiene (knip, sherif)
        run: bun run check:deps

      # Pull request: compare with the base branch. Push: compare with the commit before the push.
      - name: Migrations are append-only and safe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:migrations

      - name: Typecheck
        run: bun run typecheck

      - name: Critical tests
        run: bun run test:critical

      - name: Build
        run: bun run build

      - name: Compose file is valid
        run: docker compose config --quiet
        env:
          CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          INTERNAL_TOKEN: ci
          GIT_ADMIN_TOKEN: ci
          GIT_TOKEN_SECRET: ci
          SANDBOXD_TOKEN: ci
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          ANTHROPIC_API_KEY: ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
