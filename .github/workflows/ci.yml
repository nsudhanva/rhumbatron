# Checks for every pull request, and the first stage of the production deploy (production.yml
# calls this workflow). It uses no secrets and no remote Terraform state.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Git hooks are a local gate. CI runs the same checks as explicit steps.
  LEFTHOOK: "0"
  TERRAFORM_VERSION: 1.16.5

jobs:
  checks:
    name: lint, types, tests, guards, bundles, terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The migration guard and the secret scan compare against earlier commits.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Guardrails (Terraform-only deploys, names)
        run: bun run check:guardrails

      - name: Binding drift (wrangler.jsonc against Terraform)
        run: bun run check:bindings

      - name: Demo fixtures are current
        run: bun run check:fixtures

      - name: Dependency hygiene (knip, sherif)
        run: bun run check:deps

      # Pull request: compare with the base branch. Push: compare with the commit before the push.
      - name: D1 migrations are append-only and safe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:migrations

      - name: Typecheck
        run: bun run typecheck

      - name: Critical tests
        run: bun run test:critical

      - name: Build
        run: bun run build

      - name: Bundle Workers and the docs site
        run: bun run cf:bundle

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      # fmt, validate with -backend=false, and tflint on every root. Never contacts Cloudflare.
      - name: Terraform checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run tf:check

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
