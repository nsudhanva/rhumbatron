# Test stack: the apps image plus the stub core. See services/apps/README.md.
name: rhumbatron-apps-test
services:
  core:
    image: oven/bun:1.3.14
    command: ["bun", "/stub/stub-core.ts"]
    volumes: ["./stub-core.ts:/stub/stub-core.ts:ro"]
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
    ports: ["127.0.0.1:8790:8790"]
  apps:
    build:
      context: ../../..
      dockerfile: services/apps/Dockerfile
    image: rhumbatron-apps:test
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
      APPS_DOMAIN: rhumbatron.localhost
    ports: ["127.0.0.1:8788:8788", "127.0.0.1:8789:8789"]
    volumes: ["apps-data:/data"]
    depends_on: [core]
volumes:
  apps-data:
