<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Shop</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      li { margin: 0.4rem 0; }
    </style>
  </head>
  <body>
    <h1>Acme Shop</h1>
    <h2>Products</h2>
    <ul id="products"></ul>
    <h2>Cart</h2>
    <ul id="cart"></ul>
    <p id="total"></p>
    <script>
      const headers = { "x-user-id": "alice", "content-type": "application/json" };
      const money = (c) => `$${(c / 100).toFixed(2)}`;
      const names = {};

      async function api(path, init) {
        const res = await fetch(`/api${path}`, { headers, ...init });
        return res.json();
      }

      async function renderCart() {
        const cart = await api("/cart");
        document.getElementById("cart").innerHTML = cart.items
          .map((i) => `<li>${names[i.productId]} x ${i.quantity}
            <button data-remove="${i.productId}">Remove</button></li>`)
          .join("");
        document.getElementById("total").textContent =
          `${cart.itemCount} items, ${money(cart.subtotalCents)}`;
      }

      async function add(id) {
        await api("/cart/items", { method: "POST", body: JSON.stringify({ productId: id, quantity: 1 }) });
        renderCart();
      }

      async function remove(id) {
        await api(`/cart/items/${id}`, { method: "DELETE" });
        renderCart();
      }

      document.addEventListener("click", (e) => {
        const { add: addId, remove: removeId } = e.target.dataset;
        if (addId) add(addId);
        if (removeId) remove(removeId);
      });

      (async () => {
        const { products } = await api("/products");
        for (const p of products) names[p.id] = p.name;
        document.getElementById("products").innerHTML = products
          .map((p) => `<li>${p.name} (${money(p.priceCents)})
            <button data-add="${p.id}">Add</button></li>`)
          .join("");
        renderCart();
      })();
    </script>
  </body>
</html>
